networks:
  app_network:
    name: app_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16

services:
  postgres:
    image: postgres:18.1
    restart: always
    container_name: fastapi_pg
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - app_network
    ports:
      - "1301:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    env_file:
      - path: .env
        required: false

  backend:
    image: application
    volumes:
      - ./src:/app/src
      - ./images:/images
    env_file:
      - .env
    networks:
      - app_network
    ports:
      - "8000:8000"
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    pull_policy: build
    entrypoint: sh -c "./src/start.sh"

volumes:
  postgres_data:
